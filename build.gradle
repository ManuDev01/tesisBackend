plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tesis.urbe'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'


	// Launcher de Consola de JUnit Platform (Crucial para ejecutar 'ConsoleLauncher' desde el subproceso)
	implementation 'org.junit.platform:junit-platform-console-standalone:1.10.2'

//	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Manejo de Login
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// JUnit 5 visible en tiempo de ejecución para el compilador en memoria
	implementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
	implementation 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
	implementation 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Extraer librerías al directorio build/libs/lib
task copyDependencies(type: Copy) {
	from configurations.runtimeClasspath
	into "$buildDir/libs/lib"
}

bootJar.dependsOn copyDependencies


tasks.named('test') {
	useJUnitPlatform()
}
